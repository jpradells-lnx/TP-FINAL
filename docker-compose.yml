services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tunos_medicos
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/db/schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
      - ./backend/db/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
volumes:
  pg_data: