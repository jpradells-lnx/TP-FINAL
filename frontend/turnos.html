<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Turnos Medicos</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="navbar">
            <a href="index.html">Inicio</a>
            <a href="especialidades.html">Especialidades y Médicos</a>
            <a href="turnos.html">Sacá turno</a>
        </div>

        <div>
            <form id="form-turno">
                <label for="especialidad">Especialidad</label>
                <select id="especialidad" name="especialidad" required>
                    <option value="">Cargando...</option>
                </select>

                <label for="idMedico">Médico (opcional)</label>
                <select id="idMedico" name="idMedico" disabled>
                    <option value="">Elegí primero una especialidad</option>
                </select>

                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" name="fecha" required>

                <label for="hora">Hora</label>
                <input type="time" id="hora" name="hora" min="08:00" max="18:00" required>

                <label for="idPaciente">ID de paciente</label>
                <input type="number" id="idPaciente" name="idPaciente" min="1" required>

                <button type="submit">Pedir turno</button>
            </form>
        </div>

        <div class="footer">
            <p>Contacto:</p>
            <ul>
                <li>📞 Teléfono: 123-456-7890</li>
                <li>✉️ E-mail: turnos.medicos@hotmail.com</li>
            </ul>
        </div>
        <script src="scripts.js"></script>
    </body>
</html>
