<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Turnos Medicos</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="navbar">
            <a href="index.html" class="logo" title="Turnos Médicos Online">TMO</a>
            <div class="navbar-links">
                <a href="index.html">Inicio</a>
                <a href="especialidades.html">Especialidades y Médicos</a>
                <a href="turnos.html" class="active">Sacá turno</a>
            </div>
            <a href="personal.html" id="linkYo" class="link-yo" title="Mi perfil" aria-label="Mi perfil">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
                </svg>
            </a>
        </div>
        
        
        <div class="form-contenedor">
            <h3>Sacá tu turno Online</h3>
            <form id="form-turno" class="form-turno" novalidate>
                <label for="especialidad">Especialidad</label>
                <select id="especialidad" name="especialidad" required>
                    <option value="">Cargando...</option>
                </select>

                <label for="idMedico">Médico (opcional)</label>
                <select id="idMedico" name="idMedico" disabled>
                    <option value="">Elegí primero una especialidad</option>
                </select>

                <div id="turnosDisponibles"></div>

                <label for="dniPaciente">DNI</label>
                <input type="text" id="dniPaciente" name="dniPaciente" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="8 números, sin puntos" required>

                <button id="botonPedir" class = "boton" type="submit">Pedir turno</button>
                <p id="mensajeTurno" class="mensaje-turno oculto" role="status"></p>

                <button id="btnRegistro" class="boton" type="button" onclick="window.location.href='registro.html'" hidden>
                    Registrarme
                </button>
            </form>
        </div>

        <div class="footer">
            <div class="footer-encabezado">
                <h3>Contacto</h3>
            </div>
            <ul class="contacto-lista">
                <li><span class="inicio-icono">📞</span>Teléfono: 123-456-7890</li>
                <li><span class="inicio-icono">✉️</span>E-mail: turnos.medicos@hotmail.com</li>
            </ul>
        </div>
        <script src="js/config.js"></script>
        <script src="js/sesion.js"></script>
        <script src="js/turnos.js"></script>
    </body>
</html>
