<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Especialidades</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="navbar">
            <a href="index.html" class="logo" title="Turnos Médicos Online">TMO</a>
            <div class="navbar-links">
                <a href="index.html">Inicio</a>
                <a href="especialidades.html" class="active">Especialidades y Médicos</a>
                <a href="turnos.html">Sacá turno</a>
            </div>
        </div>

       <div id="especialidades"></div>

        <button id="agregar">+ Agregar Especialidad</button>

        <dialog id="dialogo-esp">
            <form id="form-esp">
                <input name="nombre" type="text" placeholder="Nombre de la especialidad" required>
                <input name="descripcion" type="text" placeholder="Descripción de la especialidad" required>
                <input name="monto" type="number" min="0" placeholder="Monto de la consulta" required>
                <input name="duracion" type="number" min="10" placeholder="Duración (en minutos)" required>
                <button type="submit">Agregar</button>
                <button type="button" id="cancelar">Cancelar</button>
            </form>
        </dialog>

        <div class="footer">
            <div class="footer-encabezado">
                <h3>Contacto</h3>
            </div>
            <ul class="contacto-lista">
                <li><span class="inicio-icono">📞</span>Teléfono: 123-456-7890</li>
                <li><span class="inicio-icono">✉️</span>E-mail: turnos.medicos@hotmail.com</li>
            </ul>
        </div>
        <script src="js/config.js"></script>
        <script src="js/especialidades.js"></script>
    </body>
</html>
