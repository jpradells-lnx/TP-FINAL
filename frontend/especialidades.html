<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Especialidades</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="navbar">
            <a class="active" href="index.html">Inicio</a>
            <a href="especialidades.html">Especialidades y Médicos</a>
            <a href="turnos.html">Sacá turno</a>
        </div>

        <div>
            <ul id="especialidades-lista">
                
            </ul>
        </div>

        <div class="footer">
            <p>Contacto:</p>
            <ul>
                <li>Teléfono: 123-456-7890</li>
                <li>E-mail: turnos.medicos@hotmail.com</li>
            </ul>
        </div>

        <script>
            let lista = document.getElementById("especialidades-lista");

            async function cargarEspecialidades() {
            try {
                
                const respuesta = await fetch("http://localhost:3000/api/especialidades");

                if (!respuesta.ok) {
                    throw new Error("Error " + respuesta.status);
                }

                const especialidades = await respuesta.json();

                especialidades.forEach((esp) => {
                    const elemento = document.createElement("li");
                    elemento.textContent = esp.nombre;
                    lista.appendChild(elemento);
                });
                } catch (err) {
                    const elemento = document.createElement("li");
                    elemento.textContent = "No se pudieron cargar las especialidades.";
                    lista.appendChild(elemento);
                    console.error(err);
                }
            }

            cargarEspecialidades();

        </script>
    </body>
</html>
