<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Especialidades</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="navbar">
            <a href="index.html" class="logo" title="Turnos Médicos Online">TMO</a>
            <div class="navbar-links">
                <a href="index.html">Inicio</a>
                <a href="especialidades.html" class="active">Especialidades y Médicos</a>
                <a href="turnos.html">Sacá turno</a>
            </div>
            <a href="personal.html" id="linkYo" class="link-yo" title="Mi perfil" aria-label="Mi perfil">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
                </svg>
            </a>
        </div>

       <div id="especialidades">
       </div>
       <div class="contenedor-agregar">
        <button id="agregar"  class = "boton">+ Agregar Especialidad</button>
       </div>
        
       <dialog id="dialogo-esp">
        <h2>Agregar especialidad</h2>

        <form id="form-esp">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text"
                placeholder="Nombre de la especialidad" required>

            <label for="descripcion">Descripción</label>
            <input id="descripcion" name="descripcion" type="text"
                placeholder="Descripción de la especialidad" required>

            <label for="monto">Monto de la consulta</label>
            <input id="monto" name="monto" type="number" min="0"
                placeholder="Monto en pesos" required>

            <label for="duracion">Duración</label>
            <input id="duracion" name="duracion" type="number" min="10"
                placeholder="Duración en minutos" required>

            <button type="submit" class="boton">Agregar</button>
            <button type="button" id="cancelar">Cancelar</button>
        </form>
    </dialog>

        <div class="footer">
            <div class="footer-encabezado">
                <h3>Contacto</h3>
            </div>
            <ul class="contacto-lista">
                <li><span class="inicio-icono">📞</span>Teléfono: 123-456-7890</li>
                <li><span class="inicio-icono">✉️</span>E-mail: turnos.medicos@hotmail.com</li>
            </ul>
        </div>
        <script src="js/config.js"></script>
        <script src="js/sesion.js"></script>
        <script src="js/especialidades.js"></script>
    </body>
</html>
