<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Especialidades</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="navbar">
            <a href="index.html" class="logo" title="Turnos Médicos Online">TMO</a>
            <div class="navbar-links">
                <a href="index.html">Inicio</a>
                <a href="especialidades.html">Especialidades y Médicos</a>
                <a href="turnos.html">Sacá turno</a>
            </div>
        </div>


       <div id="registro" >
        <div class="tarjeta-registro">
            <h2>Registrate como Paciente!</h2>
        <form id="formPaciente">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre" required>
            </div>

            <div class="campo">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Ingresá tu apellido" required>
            </div>

            <div class="campo">
                <label for="dni">DNI</label>
                <input type="text" id="dni" name="dni" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="8 números, sin puntos" required>
            </div>

            <div class="campo">
                <label for="fechaDeNacimiento">Fecha de nacimiento</label>
                <input type="date" id="fechaDeNacimiento" name="fechaDeNacimiento" required>
            </div>

            <div class="campo">
                <label for="contraRegistro">Contraseña</label>
                <input type="password" id="contraRegistro" name="contraRegistro" minlength="4" maxlength="12" placeholder="4 a 12 caracteres: Aa, 1 y un símbolo" required>
            </div>

            <div class="campo">
                <label for="contraRegistro2">Confirmación de contraseña</label>
                <input type="password" id="contraRegistro2" name="contraRegistro2" minlength="4" maxlength="12" placeholder="Confirmá la contraseña" required>
            </div>

            <div class="campo campo-completo">
                <label for="historiaClinica">Historia clínica (opcional)</label>
                <textarea id="historiaClinica" name="historiaClinica" placeholder="Ingresá la historia clínica"></textarea>
            </div>

            <button type="submit" class="boton campo-completo">Registrar paciente</button>
            <p id="mensajeRegistro" class="mensaje-turno oculto campo-completo" role="status"></p>
        </form>
</div>
       </div>

        <div class="footer">
            <div class="footer-encabezado">
                <h3>Contacto</h3>
            </div>
            <ul class="contacto-lista">
                <li><span class="inicio-icono">📞</span>Teléfono: 123-456-7890</li>
                <li><span class="inicio-icono">✉️</span>E-mail: turnos.medicos@hotmail.com</li>
            </ul>
        </div>
        <script src="js/config.js"></script>
        <script src="js/registro.js"></script>
    </body>
</html>
